name: Windows Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-windows:
    name: Build Windows release
    runs-on: windows-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10
          run_install: false

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - name: Cache Rust build artifacts
        uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Type-check frontend
        run: pnpm check

      - name: Build and publish Tauri release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: v__VERSION__
          releaseName: ZhiForge v__VERSION__
          releaseBody: |
            ZhiForge v__VERSION__ Windows release.

            Highlights:
            - Editable Inbox drafts with manual classification overrides, batch actions and retry/restore flows
            - AI Task Center and Today workspace for failed or interrupted processing recovery
            - Persistent review sessions and planning for first-learning and due knowledge
            - Research-plan history with linked-source revisit and duplicate-capture detection
            - Topic editing/archive/restore and global tag rename/empty-tag cleanup
            - Source-grounded extraction/questions with demo-safe structured-output fallback
            - More robust Windows first-launch window handling
            - Backup, restore, export, audit, semantic search, graph and source library

            Windows assets include the NSIS installer and a standalone portable EXE.

            Licensing:
            - Source-available under PolyForm Noncommercial License 1.0.0
            - Commercial or business use requires a separate written commercial license
            - See LICENSE and COMMERCIAL_LICENSE.md in the repository

            This release was built automatically on a GitHub-hosted Windows runner from the tagged source revision.
          releaseDraft: false
          prerelease: false

      - name: Upload portable executable to tagged release
        if: startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $portable = "ZhiForge-${{ github.ref_name }}-Windows-x64-Portable.exe"
          Copy-Item "src-tauri/target/release/zhiforge.exe" $portable
          gh release upload "${{ github.ref_name }}" $portable --clobber
          $hash = (Get-FileHash $portable -Algorithm SHA256).Hash.ToLower()
          "$hash  $portable" | Set-Content -Encoding ascii "SHA256SUMS.txt"
          gh release upload "${{ github.ref_name }}" "SHA256SUMS.txt" --clobber

      - name: Build Tauri bundles
        if: ${{ !startsWith(github.ref, 'refs/tags/v') }}
        run: pnpm tauri build

      - name: Upload verification artifacts
        if: ${{ !startsWith(github.ref, 'refs/tags/v') }}
        uses: actions/upload-artifact@v4
        with:
          name: ZhiForge-windows-x64
          path: |
            src-tauri/target/release/bundle/nsis/*.exe
            src-tauri/target/release/bundle/msi/*.msi
          if-no-files-found: error
